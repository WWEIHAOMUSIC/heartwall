<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年会爱心墙 · 管理台</title>
<link rel="stylesheet" href="/public/tokens.css">
<link rel="stylesheet" href="/public/admin.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">♥</span>
    <span class="brand-name">年会爱心墙</span>
    <span class="brand-sub">管理台</span>
  </div>
  <div class="topbar-right">
    <span class="pill" id="countPill">照片 0 张</span>
    <button class="btn btn-primary" id="btnOpenPlayer" type="button">▶ 打开播放页</button>
  </div>
</header>

<main class="layout">

  <!-- ==================== 左：照片区 ==================== -->
  <section class="panel panel-photos">
    <div class="panel-head">
      <h2>照片</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost" id="btnSaveOrder" type="button" disabled>保存排序</button>
        <button class="btn btn-ghost btn-danger" id="btnClear" type="button" disabled>清空全部</button>
      </div>
    </div>

    <!-- 上传区 -->
    <div class="dropzone" id="dropzone" tabindex="0">
      <div class="dropzone-inner">
        <div class="dropzone-icon">＋</div>
        <div class="dropzone-title">把照片拖进来，或点击选择</div>
        <div class="dropzone-hint">支持 jpg / png / heic，单张 ≤ 8MB，最多 200 张</div>
        <div class="dropzone-hint">上传时会自动压缩到 1600 像素，不用自己压</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>

    <!-- 上传进度 -->
    <div class="progress" id="progress" hidden>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">准备中 …</div>
    </div>

    <!-- 缩略图网格 -->
    <div class="grid" id="photoGrid"></div>

    <div class="empty-grid" id="emptyGrid">
      还没有照片。把照片拖到上面的虚线框里，或者点一下它。
    </div>
  </section>

  <!-- ==================== 右：设置区 ==================== -->
  <aside class="panel panel-settings">
    <div class="panel-head">
      <h2>设置</h2>
      <button class="btn btn-primary" id="btnSaveConfig" type="button">保存设置</button>
    </div>

    <div class="scroll">

      <!-- 结语文案 -->
      <div class="field-group">
        <h3>结语文案</h3>

        <label class="field">
          <span class="field-label">主文案<em>红色书法体，1–40 字</em></span>
          <input class="input" id="inpMain" type="text" maxlength="40" placeholder="感谢有你 一路同行">
        </label>

        <label class="field">
          <span class="field-label">公司署名<em>深灰小字，留空则不显示</em></span>
          <input class="input" id="inpCompany" type="text" maxlength="40" placeholder="北京XX科技有限公司">
        </label>
      </div>

      <!-- 播放节奏 -->
      <div class="field-group">
        <h3>播放节奏</h3>

        <label class="field">
          <span class="field-label">
            每张特写停留
            <em id="lblCloseup">3.0 秒（可调 0.7–8 秒）</em>
          </span>
          <input class="range" id="rngCloseup" type="range" min="700" max="8000" step="100" value="3000">
        </label>

        <label class="field field-row">
          <input class="checkbox" id="chkLoop" type="checkbox" checked>
          <span class="field-label-inline">
            循环播放
            <em>定格后停留一段时间，自动从头重播（适合整晚挂着）</em>
          </span>
        </label>

        <label class="field">
          <span class="field-label">
            定格停留
            <em id="lblLoopDelay">15 秒后重播</em>
          </span>
          <input class="range" id="rngLoopDelay" type="range" min="0" max="120" step="1" value="15">
        </label>
      </div>

      <!-- 展示样式 -->
      <div class="field-group">
        <h3>展示样式</h3>

        <label class="field">
          <span class="field-label">
            同框张数
            <em>特写段每一拍同时出现的照片数</em>
          </span>
          <select class="input" id="selEnsemble">
            <option value="0">自动随机（2–5 张，每拍都变）</option>
            <option value="2">固定 2 张（主图 + 1 张）</option>
            <option value="3">固定 3 张</option>
            <option value="4">固定 4 张</option>
            <option value="5">固定 5 张</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">
            镜头运镜
            <em>整个画面的缓慢推拉与游走</em>
          </span>
          <select class="input" id="selCamera">
            <option value="off">关闭（画面完全静止）</option>
            <option value="light">轻（若有若无）</option>
            <option value="mid">中（推荐）</option>
            <option value="strong">明显（现场大屏更有动感）</option>
          </select>
        </label>
      </div>

      <!-- 背景音乐 -->
      <div class="field-group">
        <h3>背景音乐</h3>

        <label class="field field-row">
          <input class="checkbox" id="chkMusic" type="checkbox" checked>
          <span class="field-label-inline">
            开启背景音乐
            <em>关闭后播放页完全静音</em>
          </span>
        </label>

        <label class="field">
          <span class="field-label">
            曲目
            <em>把 mp3 放进 music/ 文件夹即可</em>
          </span>
          <select class="input" id="selTrack"></select>
        </label>

        <label class="field">
          <span class="field-label">
            音量
            <em id="lblVolume">62%</em>
          </span>
          <input class="range" id="rngVolume" type="range" min="0" max="100" step="1" value="62">
        </label>
      </div>

      <!-- 扩展插件 -->
      <div class="field-group">
        <h3>扩展插件</h3>
        <div class="addon-list" id="addonList">
          <div class="addon-row addon-loading">正在读取 …</div>
        </div>
        <p class="preview-note">
          把插件文件夹整个放进 <code>addons/</code> 目录，重启服务即可生效。
        </p>
      </div>

      <!-- 心形预览 -->
      <div class="field-group">
        <h3>
          心形布局预览
          <span class="preview-meta" id="previewMeta"></span>
        </h3>
        <div class="preview-wrap">
          <canvas id="previewCanvas" width="640" height="360"></canvas>
        </div>
        <p class="preview-note">这就是照片汇聚后的大致形状，行数与格子密度会随照片数量自动变。</p>
      </div>

    </div>
  </aside>

</main>

<!-- Toast 容器 -->
<div class="toast-wrap" id="toastWrap"></div>

<script type="module" src="/public/admin.js"></script>
</body>
</html>
